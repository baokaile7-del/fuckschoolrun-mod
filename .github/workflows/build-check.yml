name: Build Check

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Inject API Key
        run: |
          echo 'MAPS_API_KEY=test_key' >> local.properties
          echo 'MAPS_SAFE_CODE=test_safe_code' >> local.properties
          cat local.properties

      - name: Generate temporary keystore and print SHA1
        run: |
          KEYSTORE_DIR="$HOME/.android"
          KEYSTORE_FILE="$KEYSTORE_DIR/debug.keystore"
          mkdir -p "$KEYSTORE_DIR"
          keytool -genkey -v -keystore "$KEYSTORE_FILE" -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storepass android -keypass android 2>/dev/null
          echo "=== SHA1 fingerprint ==="
          keytool -list -v -keystore "$KEYSTORE_FILE" -alias androiddebugkey -storepass android 2>/dev/null | grep -i "SHA1:"
          echo "========================"
          echo "=== MD5 fingerprint ==="
          keytool -list -v -keystore "$KEYSTORE_FILE" -alias androiddebugkey -storepass android 2>/dev/null | grep -i "MD5:"
          echo "========================"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/**/*.apk 

